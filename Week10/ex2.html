<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Multiplication Table</title>
    <style>
        table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        td, th {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }
        .header {
            background-color: #f2f2f2;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">MULTIPLICATION TABLE</h2>

    <script language="javascript">
        document.write("<table>");
        
        for (var i = 1; i <= 10; i++) {
            document.write("<tr>");
            
            for (var j = 1; j <= 10; j++) {
                if (i == 1 || j == 1) {
                    document.write("<td class='header'>" + (i * j) + "</td>");
                } else {
                    document.write("<td>" + (i * j) + "</td>");
                }
            }
            
            document.write("</tr>");
        }
        
        document.write("</table>");
    </script>

</body>
</html>
