<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Calculator (Regex & Eval)</title>
    <script>
        function calculate() {
            var num1 = document.getElementById("num1").value.trim();
            var operator = document.getElementById("operator").value.trim();
            var num2 = document.getElementById("num2").value.trim();
            
            var expression = num1 + operator + num2;
            
            var regex = /^-?\d+(\.\d+)?[\+\-\*\/\%]-?\d+(\.\d+)?$/;

            if (regex.test(expression)) {
                var result = eval(expression);
                document.getElementById("result").value = result;
            } else {
                alert("Dữ liệu không hợp lệ! Vui lòng nhập đúng số và toán tử (+, -, *, /, %).");
                document.getElementById("result").value = "Lỗi";
            }
        }
    </script>
</head>
<body style="font-family: Arial, sans-serif;">

    <table border="1" align="center" cellpadding="8" style="border-collapse: collapse; margin-top: 50px;">
        <tr>
            <td colspan="2" align="center" style="background-color: #f2f2f2;">
                <h3>SIMPLE CALCULATOR</h3>
            </td>
        </tr>
        <tr>
            <td align="right">Number 1:</td>
            <td><input type="text" id="num1"></td>
        </tr>
        <tr>
            <td align="right">Operator:</td>
            <td><input type="text" id="operator" size="5"></td>
        </tr>
        <tr>
            <td align="right">Number 2:</td>
            <td><input type="text" id="num2"></td>
        </tr>
        <tr>
            <td colspan="2" align="center">
                <button type="button" onclick="calculate()" style="padding: 5px 15px; cursor: pointer;">Calculate</button>
            </td>
        </tr>
        <tr>
            <td align="right" style="font-weight: bold;">Result:</td>
            <td><input type="text" id="result" readonly style="background-color: #e9ecef;"></td>
        </tr>
    </table>

</body>
</html>
